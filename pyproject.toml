[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langgraph-checkpoint-objectstorage"
version = "0.1.10"
description = "LangGraph checkpoint saver backed by local filesystem, GCS, or S3 via fsspec"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "langgraph-checkpoint>=4.0,<5",
    "langchain-core>=0.2.38",
    "fsspec>=2024.10.0",
    "ormsgpack>=1.12.0",
    "typeguard>=4.0",
]

[project.optional-dependencies]
s3 = ["s3fs>=2024.10.0"]
gcs = ["gcsfs>=2024.10.0"]
compression = ["zstandard>=0.22"]
encryption = ["cryptography>=42"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "langgraph-checkpoint-conformance>=0.0.2",
    "moto[s3,server]>=5.0",
    "boto3>=1.34",
    "s3fs>=2024.10.0",
    "gcsfs>=2024.10.0",
    "requests>=2.30",
    "bandit>=1.9.4",
    "pyflakes>=3.4.0",
    "vulture>=2.16",
    "black>=26.5.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/langgraph_checkpoint_objectstorage"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
